connectorId: torqueflow-connector

# No se genera SDK de cliente ni admin: las funciones de api/clients y
# api/vehicles llaman a Data Connect con firebase-admin/data-connect
# (getDataConnect().executeGraphql) usando las operaciones definidas en
# connector.gql por nombre. Esto evita depender de un paquete generado que
# quede desincronizado del esquema cada vez que este archivo cambia.
#
# Si en el futuro prefieres el SDK tipado, puedes agregar de nuevo la
# seccion "generate" y correr `firebase dataconnect:sdk:generate`.
