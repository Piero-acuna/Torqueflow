# Todas las operaciones son NO_ACCESS para clientes de Firebase Auth: solo se
# ejecutan desde el backend con el SDK admin (que ignora @auth y siempre
# recibe workshopId ya validado contra la membresía real en Firestore).
# Ver api/_lib/dataconnect-admin.js y api/_lib/require-member.js.

query ListClients($workshopId: String!, $search: String) @auth(level: NO_ACCESS) {
  clients(
    where: {
      workshopId: { eq: $workshopId }
      active: { eq: true }
      _or: [
        { name: { contains: $search } }
        { documentNumber: { contains: $search } }
        { phone: { contains: $search } }
      ]
    }
    orderBy: { name: ASC }
  ) {
    id
    type
    documentType
    documentNumber
    name
    phone
    email
    address
    segment
    creditLimit
    notes
    createdAt
    updatedAt
  }
}

query GetClient($workshopId: String!, $id: UUID!) @auth(level: NO_ACCESS) {
  client(id: $id) {
    id
    workshopId
    type
    documentType
    documentNumber
    name
    phone
    email
    address
    segment
    creditLimit
    notes
    active
    createdAt
    updatedAt
    vehicles: vehicles_on_client(where: { active: { eq: true } }, orderBy: { plate: ASC }) {
      id
      plate
      brand
      model
      year
      color
      mileage
      fuelType
      vin
      notes
    }
  }
}

mutation CreateClient(
  $workshopId: String!
  $type: String
  $documentType: String
  $documentNumber: String
  $name: String!
  $phone: String
  $email: String
  $address: String
  $segment: String
  $creditLimit: Float
  $notes: String
) @auth(level: NO_ACCESS) {
  client_insert(
    data: {
      workshopId: $workshopId
      type: $type
      documentType: $documentType
      documentNumber: $documentNumber
      name: $name
      phone: $phone
      email: $email
      address: $address
      segment: $segment
      creditLimit: $creditLimit
      notes: $notes
    }
  )
}

mutation UpdateClient(
  $id: UUID!
  $type: String
  $documentType: String
  $documentNumber: String
  $name: String
  $phone: String
  $email: String
  $address: String
  $segment: String
  $creditLimit: Float
  $notes: String
) @auth(level: NO_ACCESS) {
  client_update(
    id: $id
    data: {
      type: $type
      documentType: $documentType
      documentNumber: $documentNumber
      name: $name
      phone: $phone
      email: $email
      address: $address
      segment: $segment
      creditLimit: $creditLimit
      notes: $notes
      updatedAt_expr: "request.time"
    }
  )
}

mutation DeactivateClient($id: UUID!) @auth(level: NO_ACCESS) {
  client_update(id: $id, data: { active: false, updatedAt_expr: "request.time" })
}

query ListVehicles($workshopId: String!, $clientId: UUID, $search: String) @auth(level: NO_ACCESS) {
  vehicles(
    where: {
      workshopId: { eq: $workshopId }
      active: { eq: true }
      clientId: { eq: $clientId }
      _or: [
        { plate: { contains: $search } }
        { brand: { contains: $search } }
        { model: { contains: $search } }
      ]
    }
    orderBy: { plate: ASC }
  ) {
    id
    plate
    brand
    model
    year
    color
    mileage
    fuelType
    vin
    notes
    client {
      id
      name
      phone
    }
  }
}

query GetVehicle($workshopId: String!, $id: UUID!) @auth(level: NO_ACCESS) {
  vehicle(id: $id) {
    id
    workshopId
    plate
    brand
    model
    year
    color
    mileage
    fuelType
    vin
    notes
    active
    client {
      id
      name
      phone
      email
    }
  }
}

mutation CreateVehicle(
  $workshopId: String!
  $clientId: UUID!
  $plate: String!
  $brand: String
  $model: String
  $year: Int
  $color: String
  $mileage: Int
  $fuelType: String
  $vin: String
  $notes: String
) @auth(level: NO_ACCESS) {
  vehicle_insert(
    data: {
      workshopId: $workshopId
      clientId: $clientId
      plate: $plate
      brand: $brand
      model: $model
      year: $year
      color: $color
      mileage: $mileage
      fuelType: $fuelType
      vin: $vin
      notes: $notes
    }
  )
}

mutation UpdateVehicle(
  $id: UUID!
  $plate: String
  $brand: String
  $model: String
  $year: Int
  $color: String
  $mileage: Int
  $fuelType: String
  $vin: String
  $notes: String
) @auth(level: NO_ACCESS) {
  vehicle_update(
    id: $id
    data: {
      plate: $plate
      brand: $brand
      model: $model
      year: $year
      color: $color
      mileage: $mileage
      fuelType: $fuelType
      vin: $vin
      notes: $notes
      updatedAt_expr: "request.time"
    }
  )
}

mutation DeactivateVehicle($id: UUID!) @auth(level: NO_ACCESS) {
  vehicle_update(id: $id, data: { active: false, updatedAt_expr: "request.time" })
}
