# Esquema de Cloud SQL (Postgres) vía Firebase Data Connect.
#
# Alcance deliberadamente acotado: SOLO "Client" y "Vehicle" viven aquí.
# El resto del sistema (órdenes, repuestos, movimientos de stock, mecánicos,
# servicios) sigue en Firestore porque necesita lecturas en tiempo real y
# transacciones optimistas que Data Connect no ofrece igual.
#
# IMPORTANTE — modelo de seguridad:
# Data Connect no puede evaluar la membresía de un taller (eso vive en
# Firestore, en workshops/{workshopId}/members/{uid}). Por eso NINGUNA
# operación de este conector se expone al cliente con auth de usuario:
# todas están marcadas @auth(level: NO_ACCESS) en connector.gql y solo se
# ejecutan desde el backend (funciones de Vercel) usando el SDK admin de
# Firebase, que verifica el token + la membresía en Firestore antes de
# tocar Postgres. Todas las filas llevan "workshopId" y cada consulta/mutación
# lo recibe como variable obligatoria; es responsabilidad de la capa de API
# (no de la base) filtrar y validar ese valor. Ver api/_lib/require-member.js.

type Client @table(name: "clients", key: ["id"]) {
  id: UUID! @default(expr: "uuidV4()")
  workshopId: String!
  type: String! @default(value: "person")
  documentType: String
  documentNumber: String
  name: String!
  phone: String
  email: String
  address: String
  segment: String! @default(value: "new")
  creditLimit: Float! @default(value: 0)
  notes: String
  active: Boolean! @default(value: true)
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

type Vehicle @table(name: "vehicles", key: ["id"]) {
  id: UUID! @default(expr: "uuidV4()")
  workshopId: String!
  client: Client!
  plate: String!
  brand: String
  model: String
  year: Int
  color: String
  mileage: Int
  fuelType: String
  vin: String
  notes: String
  active: Boolean! @default(value: true)
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

# Nota de seguimiento (no bloquea el despliegue):
# conviene agregar, con una migración SQL manual, índices compuestos
# (workshop_id, name) en clients y (workshop_id, plate) en vehicles, y una
# restricción UNIQUE (workshop_id, plate) para no depender solo de la
# validación de aplicación. Data Connect permite migraciones SQL a mano en
# dataconnect/schema junto al .gql; no se generó aquí porque requiere
# probarse contra la instancia real de Cloud SQL.
